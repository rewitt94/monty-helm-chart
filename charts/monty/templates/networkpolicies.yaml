{{- if .Values.networkPolicy.enabled }}
{{- $ingressFrom := .Values.networkPolicy.ingressFrom }}
{{- /* An empty from list would allow all sources. */}}
{{- if not $ingressFrom }}
{{- fail "networkPolicy.ingressFrom must list the ingress/gateway sources allowed to reach the server" }}
{{- end }}
{{- /* Reject peers that match everything: empty selectors, 0.0.0.0/0 and ::/0. */}}
{{- range $index, $peer := $ingressFrom }}
{{- range $key := list "namespaceSelector" "podSelector" }}
{{- $selector := get $peer $key }}
{{- if and (hasKey $peer $key) (not (or $selector.matchLabels $selector.matchExpressions)) }}
{{- fail (printf "networkPolicy.ingressFrom[%d].%s must not be empty; an empty selector matches everything" $index $key) }}
{{- end }}
{{- end }}
{{- with $peer.ipBlock }}
{{- if has .cidr (list "0.0.0.0/0" "::/0") }}
{{- fail (printf "networkPolicy.ingressFrom[%d].ipBlock.cidr must not allow every address" $index) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $component := list "server" "worker" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "monty.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "monty.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "monty.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- /* Server: configured ingress/gateway sources. Worker: this release's servers only. */}}
        {{- if eq $component "server" }}
        {{- toYaml $ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "monty.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: server
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- end }}
