name: Test Chart

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          # v4.2.1 hangs during kind/local-path uninstall waits.
          version: v4.2.0

      - name: Test chart
        run: bash ci/check-chart.sh

  integration:
    needs: test
    # Private image access is never granted to PR code, including same-repo PRs.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_INTEGRATION_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.0

      - name: Validate application version
        run: helm template monty charts/monty -f charts/monty/values.dev.yaml > /dev/null

      - name: Create Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1

      - name: Set up GCP auth
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false

      - name: Create image pull secret
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          kubectl create namespace monty
          kubectl -n monty create secret docker-registry monty-image-key \
            --docker-server=us-docker.pkg.dev \
            --docker-username=oauth2accesstoken \
            --docker-password="$ACCESS_TOKEN"

      - name: Test install and upgrade
        run: |
          for drain_grace in 30 31; do
            helm upgrade --install monty charts/monty -n monty -f charts/monty/values.dev.yaml \
              --set drainGraceSeconds="$drain_grace" --wait --timeout 5m

            kubectl -n monty port-forward svc/monty-server 8000:8000 &
            pf_pid=$!
            trap 'kill "$pf_pid" 2>/dev/null || true; wait "$pf_pid" 2>/dev/null || true' EXIT
            for _ in {1..30}; do
              if curl --fail --silent --max-time 2 http://localhost:8000/health > /dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail --silent --show-error --max-time 5 http://localhost:8000/health
            result=$(curl --fail --silent --show-error --max-time 30 \
              --header 'Content-Type: text/plain' --data-binary '1 + 1' http://localhost:8000/run)
            if [[ "$result" != 2 ]]; then
              printf 'Unexpected execution result: %s\n' "$result" >&2
              exit 1
            fi
            kill "$pf_pid" 2>/dev/null || true
            wait "$pf_pid" 2>/dev/null || true
            trap - EXIT
          done

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n monty get pods -o wide || true
          kubectl -n monty get events --sort-by=.lastTimestamp || true
          kubectl -n monty logs deployment/monty-server --all-pods --tail=200 || true
          kubectl -n monty logs deployment/monty-worker --all-pods --tail=200 || true
