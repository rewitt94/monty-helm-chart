name: Test Chart

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          # Match Logfire; v4.2.1 hangs during kind/local-path uninstall waits.
          version: v4.2.0

      - name: Test chart
        run: bash check.sh

      - name: Test release notes
        run: node --test .github/scripts/release-notes.test.js

  integration:
    needs: test
    # Private image access is never granted to PR code, including same-repo PRs.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_INTEGRATION_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.0

      - name: Validate application version
        run: helm template monty charts/monty -f charts/monty/values.dev.yaml > /dev/null

      - name: Create Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1

      - name: Set up GCP auth
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false

      - name: Create image pull secret
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          kubectl create namespace monty
          kubectl -n monty create secret docker-registry monty-image-key \
            --docker-server=us-docker.pkg.dev \
            --docker-username=oauth2accesstoken \
            --docker-password="$ACCESS_TOKEN"

      - name: Install chart
        run: |
          helm install monty charts/monty -n monty -f charts/monty/values.dev.yaml --wait --timeout 5m
          bash .github/scripts/smoke-test.sh

      - name: Test upgrade
        run: |
          helm upgrade monty charts/monty -n monty -f charts/monty/values.dev.yaml \
            --set drainGraceSeconds=31 --wait --timeout 5m
          bash .github/scripts/smoke-test.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n monty get pods -o wide || true
          kubectl -n monty get events --sort-by=.lastTimestamp || true
          kubectl -n monty logs deployment/monty-server --all-pods --tail=200 || true
          kubectl -n monty logs deployment/monty-worker --all-pods --tail=200 || true
