name: Release Charts

on:
  push:
    branches:
      - main
    tags:
      - 'monty-*'

permissions:
  contents: read

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.0

      - name: Detect prerelease
        id: prerelease
        run: |
          version=$(helm show chart charts/monty | awk '$1 == "version:" {print $2}')
          test -n "$version"
          tag="monty-$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match chart version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'is_prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Test chart
        run: bash ci/check-chart.sh

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

